name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug: List root directory
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing root directory:"
          ls -la

      - name: Debug: List frontend directory
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing frontend directory:"
          ls -la frontend/

      - name: Debug: Check for package-lock.json in frontend
        run: |
          echo "Current directory: $(pwd)"
          if [ -f "frontend/package-lock.json" ]; then
            echo "FOUND: frontend/package-lock.json"
            ls -la frontend/package-lock.json
          else
            echo "NOT FOUND: frontend/package-lock.json"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing current directory:"
          ls -la
          npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing current directory:"
          ls -la
          npm run build

      - name: Create .nojekyll file
        run: touch frontend/dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
