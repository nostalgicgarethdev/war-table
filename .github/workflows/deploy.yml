name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show directory structure
        run: |
          echo "=== SHOWING REPOSITORY STRUCTURE ==="
          pwd
          ls -la
          echo ""
          echo "=== FRONTEND DIRECTORY ==="
          ls -la frontend/
          echo ""
          echo "=== CHECKING FOR PACKAGE-LOCK.JSON ==="
          if [ -f "frontend/package-lock.json" ]; then
            echo "✓ FOUND: frontend/package-lock.json"
            ls -la frontend/package-lock.json
          else
            echo "✗ NOT FOUND: frontend/package-lock.json"
          fi
          echo ""
          echo "=== CONTENTS OF FRONTEND/ ==="
          ls -la frontend/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          echo "=== INSTALLING DEPENDENCIES ==="
          pwd
          ls -la
          cd frontend
          echo "Changed to frontend directory:"
          pwd
          ls -la package-lock.json
          npm ci

      - name: Build Frontend
        run: |
          echo "=== BUILDING FRONTEND ==="
          pwd
          cd frontend
          echo "Changed to frontend directory:"
          pwd
          npm run build

      - name: Create .nojekyll file
        run: touch frontend/dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
