name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug directory structure
        run: |
          echo "Repository root:"
          ls -la
          echo ""
          echo "Frontend directory:"
          ls -la frontend/
          echo ""
          echo "Checking for package-lock.json in frontend:"
          ls -la frontend/package-lock.json || echo "NOT FOUND"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents of current directory:"
          ls -la
          echo ""
          echo "Trying npm ci with --prefix frontend:"
          npm ci --prefix frontend
          echo ""
          echo "Contents of frontend/node_modules after install (if any):"
          ls -la frontend/node_modules 2>/dev/null || echo "frontend/node_modules does not exist yet"

      - name: Build Frontend
        run: |
          echo "Current directory: $(pwd)"
          echo "Trying npm run build with --prefix frontend:"
          npm run build --prefix frontend

      - name: Create .nojekyll file
        run: touch frontend/dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
